name: 'Build frontend'
description: 'Build frontend in staging or production versions'

inputs:
  environment:
    required: true
    description: 'staging or production'
    default: 'production'
  release_version:
    required: false
    description: 'Release version added to production builds'
    default: ${{ github.sha }}
  sentry_dns:
    required: false
    description: 'Sentry url to send error logs to (only production, enforced)'
    default: ''
  push:
    required: false
    description: Also push built image to toska registry
    default: 'false'
  registry_password:
    required: false
    description: Push token for registry.version.helsinki.fi
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to registry.version.helsinki.fi
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: registry.version.helsinki.fi
        username: kontit
        password: ${{ inputs.registry_password }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          registry.version.helsinki.fi/toska/openshift/kontit/oodikone-frontend
        tags: |
          ${{ inputs.environment }}
          ${{ github.sha }}

    - name: Get current time
      id: get_current_time
      shell: bash
      run: echo "NOW=$(date --iso-8601=seconds)" >> $GITHUB_OUTPUT

    - name: 'Build image and export it'
      id: build-image-action
      uses: docker/build-push-action@v7
      with:
        context: services
        file: services/frontend/Dockerfile
        build-args: |
          GIT_SHA=${{ github.sha }}
          STAGING=${{ case(inputs.environment == 'staging', 'true', 'false') }}
          BASE_PATH=${{ case(inputs.environment == 'staging', '/oodikone', '') }}
          SENTRY_ENVIRONMENT=${{ inputs.environment }}
          SENTRY_RELEASE=${{ inputs.release_version }}
          BUILT_AT=${{ steps.get_current_time.outputs.NOW }}
          SENTRY_DSN=${{ case(inputs.environment == 'production', inputs.sentry_dns, '') }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        provenance: false
        sbom: false
      env:
        DOCKER_BUILD_SUMMARY: false
