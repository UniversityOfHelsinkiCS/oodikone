name: 'Build updater scheduler'
description: 'Build updater scheduler in staging or production version'

inputs:
  environment:
    required: true
    description: 'staging or production'
    default: 'production'
  release_version:
    required: false
    description: 'Release version added to production builds'
    default: ${{ github.sha }}
  push:
    required: false
    description: Also push built image to toska registry
    default: 'false'
  registry_password:
    required: false
    description: Push token for registry.version.helsinki.fi
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to registry.version.helsinki.fi
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: registry.version.helsinki.fi
        username: kontit
        password: ${{ inputs.registry_password }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          registry.version.helsinki.fi/toska/openshift/kontit/oodikone-updater-scheduler
        tags: |
          ${{ inputs.environment }}
          ${{ github.sha }}

    - name: 'Build image and export it'
      id: build-image-action
      uses: docker/build-push-action@v7
      with:
        context: updater/sis-updater-scheduler
        file: updater/sis-updater-scheduler/Dockerfile
        build-args: |
          GIT_SHA=${{ github.sha }}
          STAGING=${{ case(inputs.environment == 'staging', 'true', 'false') }}
          SENTRY_ENVIRONMENT=${{ inputs.environment }}
          SENTRY_RELEASE=${{ inputs.release_version }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
      env:
        DOCKER_BUILD_SUMMARY: false
