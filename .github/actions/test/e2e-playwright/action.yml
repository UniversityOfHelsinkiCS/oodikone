name: Run e2e tests with playwright
description: Runs playwright tests for individual spec

inputs:
  username:
    required: true
    description: 'Toska registry username'
  password:
    required: true
    description: 'Toska registry password'
  spec:
    required: true
    description: 'Path to test file'
  test_name:
    required: true
    description: 'Name of the test'

runs:
  using: composite
  steps:
    - name: 'Login to toska Docker registry'
      uses: docker/login-action@v4
      with:
        registry: registry-toska.ext.ocp-prod-0.k8s.it.helsinki.fi
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: 'Run services, pull rest of the needed images'
      shell: bash
      run: docker compose --file docker-compose.ci.yml --profile oodikone up --detach --quiet-pull

    - name: Run playwright tests (${{ inputs.test_name }}})
      shell: bash
      run: |
        CI='true' npm run playwright ${{ inputs.spec }}

    - name: 'Print logs on failure'
      shell: bash
      if: failure()
      run: npm run logs:ci && sleep 15

    - name: Teardown containers started by compose
      if: always()
      uses: ./.github/actions/teardown
