name: oodikone

x-defaults: &defaults
  restart: unless-stopped

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s # Normal healthcehck interval
  timeout: 5s
  retries: 10 # Retries until SIGKILl
  start_interval: 3s # How often healthcheck runs while starting
  start_period: 30s # How long startup period is

services:
  sis-db:
    <<: *defaults
    container_name: oodikone-sis-db
    image: registry-toska.ext.ocp-prod-0.k8s.it.helsinki.fi/sis-db
    pull_policy: always
    volumes: !reset [] # Remove previous volume definitions
    environment:
      PGDATA: /data
      POSTGRES_DB: sis-db
      POSTGRES_HOST_AUTH_METHOD: trust
    shm_size: 2gb
    ports:
      - 12345:5432
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', '127.0.0.1']
      <<: *healthcheck-defaults
